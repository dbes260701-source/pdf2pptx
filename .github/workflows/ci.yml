name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # OCR(Windows.Media.Ocr)과 PowerPoint COM 이 Windows 전용이므로 windows 러너를 쓴다.
    # 다만 CI 에서 도는 테스트는 OCR/PowerPoint 없이 합성 픽스처로만 동작한다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 테스트
        run: python -m pytest tests -v --cov=quality --cov=build --cov-report=term-missing

      - name: 작업 산출물이 커밋되지 않았는지 확인
        shell: bash
        run: |
          # 평가서 [A] §12 회귀 방지: work_*/ build/ dist/ 등이 다시 추적되면 실패시킨다
          leaked=$(git ls-files | grep -E '^(build|dist|__pycache__|work|work_)/|^build_log.*\.txt$|\.exe$' || true)
          if [ -n "$leaked" ]; then
            echo "빌드/작업 산출물이 추적되고 있습니다:"; echo "$leaked"; exit 1
          fi
